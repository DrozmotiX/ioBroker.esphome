name: Dashboard Integration

# The ESPHome dashboard integration tests build a real Python virtual environment and
# pip-install esphome + pillow from PyPI (about 4 minutes). They run for every pull request and
# push to main/v2.
# Push is limited to the target branches, otherwise a branch with an open PR runs twice.
# This workflow is intentionally NOT part of the release pipeline - a slow or rate limited
# PyPI/GitHub API must never block a release.
on:
    push:
        branches:
            - main
            - v2
    pull_request: {}
    workflow_dispatch: {}

# Prefixed with the workflow name so it does not share the group with "Test and Release"
concurrency:
    group: dashboard-${{ github.ref }}
    cancel-in-progress: true

jobs:
    dashboard-integration:
        runs-on: ubuntu-latest
        timeout-minutes: 45

        env:
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
            ESPHOME_RUN_DASHBOARD_TESTS: 'true'

        steps:
            - uses: actions/checkout@v7

            - uses: actions/setup-node@v7
              with:
                  node-version: '24.x'
                  cache: 'npm'

            - uses: actions/setup-python@v7
              with:
                  python-version: '3.13'

            - run: npm ci

            # The integration test starts the compiled adapter from build/
            - run: npm run build

            - run: npm run test:integration
