name: Dashboard Integration

# The ESPHome dashboard integration tests build a real Python virtual environment and
# pip-install esphome + pillow from PyPI. That is too slow and too network dependent to run
# on every push, so they are executed on demand and once per week instead.
# This workflow is intentionally NOT part of the release pipeline - a slow or rate limited
# PyPI/GitHub API must never block a release.
on:
    workflow_dispatch: {}
    schedule:
        # Sundays 03:17 UTC - off peak, lower GitHub API rate limit pressure
        - cron: '17 3 * * 0'

jobs:
    dashboard-integration:
        runs-on: ubuntu-latest
        timeout-minutes: 45

        env:
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
            ESPHOME_RUN_DASHBOARD_TESTS: 'true'

        steps:
            - uses: actions/checkout@v7

            - uses: actions/setup-node@v7
              with:
                  node-version: '24.x'
                  cache: 'npm'

            - uses: actions/setup-python@v7
              with:
                  python-version: '3.13'

            - run: npm ci

            - run: npm run test:integration
