name: Test and Release

# Run this job on pull requests, pushes to the target branches and tags with a semantic version.
# Push is limited to main/v2 like in the create-adapter template (the repo checker E3037 needs "*"
# or the default branch), otherwise a branch with an open PR runs twice: once for the push and
# once for the pull request, and the concurrency group cannot merge them (different refs).
on:
    push:
        branches:
            - main
            - v2
        tags:
            # normal versions
            - 'v[0-9]+.[0-9]+.[0-9]+'
            # pre-releases
            - 'v[0-9]+.[0-9]+.[0-9]+-**'
    pull_request: {}

# Cancel previous PR/branch runs when a new commit is pushed.
# The repo checker (W3009) expects exactly this form. A release run is still safe: a tag is its
# own ref, so only pushing the same tag again could cancel it. The other workflows prefix their
# group with their name (e.g. "e2e-"), so this group does not need the workflow name.
concurrency:
    group: ${{ github.ref }}
    cancel-in-progress: true

jobs:
    # Performs quick checks before the expensive test runs
    check-and-lint:
        if: contains(github.event.head_commit.message, '[skip ci]') == false

        runs-on: ubuntu-latest

        steps:
            - uses: ioBroker/testing-action-check@v2
              with:
                  node-version: '24.x'
                  # Uncomment the following line if your adapter cannot be installed using 'npm ci'
                  # install-command: 'npm install'
                  # Runs "npm run check" (tsc --noEmit over src/ and the test files) so type errors cannot slip in unnoticed
                  type-checking: true
                  lint: true

    # Runs adapter tests on all supported node versions and OSes
    adapter-tests:
        needs: [check-and-lint]
        if: contains(github.event.head_commit.message, '[skip ci]') == false

        runs-on: ${{ matrix.os }}
        # Windows legs take 15-27 minutes, well above the 4-7 minutes of the other OSes
        timeout-minutes: 45
        strategy:
            # Do not cancel the remaining matrix legs when one of them fails,
            # otherwise a single flaky OS/node combination hides all other results
            fail-fast: false
            matrix:
                node-version: [22.x, 24.x, 26.x]
                # Windows is required by the repo checker (E3027) unless package.json "os" excludes it.
                # The adapter works on Windows, so it stays tested there rather than excluded.
                os: [ubuntu-latest, windows-latest, macos-latest]

        env:
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

        steps:
            - uses: ioBroker/testing-action-adapter@v1
              with:
                  node-version: ${{ matrix.node-version }}
                  os: ${{ matrix.os }}
                  # Uncomment the following line if your adapter cannot be installed using 'npm ci'
                  # install-command: 'npm install'
                  # Compiles src/ to build/ before the tests run
                  build: true

    # NOTE: Automatic npm releases are configured via npm Trusted Publishing (OIDC)
    # using ioBroker/testing-action-deploy@v1 and the id-token permission below.
    # Ensure your npm package is set up for GitHub OIDC; no NPM_TOKEN secret is required.

    # Deploys the final package to NPM
    deploy:
        needs: [check-and-lint, adapter-tests]

        # Trigger this step only when a commit on any branch is tagged with a version number
        if: |
            contains(github.event.head_commit.message, '[skip ci]') == false &&
            github.event_name == 'push' &&
            startsWith(github.ref, 'refs/tags/v')

        runs-on: ubuntu-latest

        # Write permissions are required to create Github releases
        permissions:
            contents: write
            id-token: write

        steps:
            - uses: ioBroker/testing-action-deploy@v1
              with:
                  node-version: '24.x'
                  # Uncomment the following line if your adapter cannot be installed using 'npm ci'
                  # install-command: 'npm install'
                  # Compiles src/ to build/ before publishing
                  build: true
                  # npm-token: ${{ secrets.NPM_TOKEN }}  # Commented out for migration to Trusted Publishing
                  github-token: ${{ secrets.GITHUB_TOKEN }}

                  # Do NOT set the "tag" input to influence the npm dist-tag. It overrides the
                  # version to publish, not the dist-tag: the action derives the version from it and
                  # only then appends "--tag next" for versions containing a "-". Passing "next"
                  # makes that check fail, so a pre-release is published without a dist-tag and npm
                  # rejects it. Pre-releases already land under "next" without any configuration.

                  # Sentry is informed about the release by the next step, not by this action
                  sentry: false

            # Sentry release with the source maps of build/ (built by the step above). Only meta information
            # for the error reports, published under the same name the action used. sentry.iobroker.net
            # refuses connections at times: 2.0.0-beta.1 and beta.2 timed out at "finalize" after npm and
            # the GitHub release had gone through, and the whole run was red. Each call is tried 3 times with
            # its own time limit, and a failure here leaves a warning but never fails a release that is
            # already published. That is handled by the script, not with "continue-on-error" (repo checker
            # W3046), so any other error of the job still fails it.
            - name: Create Sentry release
              # Above the longest run of the script: 3 calls x (3 x 3 min + 2 x 1 min)
              timeout-minutes: 40
              env:
                  SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
                  SENTRY_URL: https://sentry.iobroker.net
                  SENTRY_ORG: iobroker
                  SENTRY_PROJECT: iobroker-esphome
              run: |
                  SENTRY_VERSION="iobroker.esphome@${GITHUB_REF_NAME#v}"
                  retry() {
                      for attempt in 1 2 3; do
                          timeout 180 "$@" && return 0
                          echo "::warning::Sentry, attempt $attempt of 3 failed: $*"
                          if [ "$attempt" -lt 3 ]; then sleep 60; fi
                      done
                      return 1
                  }
                  sentry_release() {
                      # Same sentry-cli version as ioBroker/testing-action-deploy@v1, newer ones dropped "releases files"
                      npm i -g @sentry/cli@2.58.4 || return 1
                      retry sentry-cli releases new "$SENTRY_VERSION" || return 1
                      retry sentry-cli releases files "$SENTRY_VERSION" upload-sourcemaps build/ || return 1
                      retry sentry-cli releases finalize "$SENTRY_VERSION" || return 1
                  }
                  if ! sentry_release; then
                      echo "::warning::Sentry release $SENTRY_VERSION could not be created, npm and the GitHub release are published"
                  fi
